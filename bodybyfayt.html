<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODYBYFAYT</title>
    <link rel="icon" href="fayt.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bodybyfayt.css">
</head>
<body>
    <div class="welcome">
        <p>Welcome to our store</p>
    </div>

    <header>
        <a href="#" class="logo">
            <img src="logo-white.png" alt="Body by fayt logo">
        </a>

        <nav>
            <ul>
                <li><a href="#home">Home</a> </li>
                <li><a href="#shop">Shop</a></li>
                <li><a href="#benefits">Benefits</a></li>
                <li><a href="#reviews">Reviews</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <!-- <button type="button" class="cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L20.5 7H6"/>
                <circle cx="9.5" cy="20" r="1.4"/>
                <circle cx="17" cy="20" r="1.4"/>
            </svg>
        </button> -->
    </header>
    <section id="home" class="hero-slider" aria-roledescription="carousel" aria-label="Hero banner">      <div class="hero-slider__track">
      <div class="hero-slider__slide">
        <img src="IMG-20261101-WA8235-bodybyfayt-2x.webp" alt="Slide 1">
      </div>
      <div class="hero-slider__slide">
        <img src="IMG-20261101-WA1567-bodybyfayt-2x.webp" alt="Slide 2">
      </div>
      <div class="hero-slider__slide">
        <img src="IMG-20261101-WA7655-bodybyfayt-2x.webp" alt="Slide 3">
      </div>

    </div>
    <button class="hero-slider__arrow hero-slider__arrow--prev" type="button" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="hero-slider__arrow hero-slider__arrow--next" type="button" aria-label="Next slide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="hero-slider__dots">
      <button class="hero-slider__dot is-active" type="button" aria-label="Go to slide 1"></button>
      <button class="hero-slider__dot" type="button" aria-label="Go to slide 2"></button>
      <button class="hero-slider__dot" type="button" aria-label="Go to slide 3"></button>
    </div>
    <script src="fayt.js"></script>
  </section>

<section id="shop" class="bbf-products" id="products" aria-labelledby="bbf-products-title">
  <div class="bbf-container">
    <!-- <header class="bbf-head">
      <h2 id="bbf-products-title">Our Products</h2>
      <p>Organic body enhancement products by BODYBYFAYT</p>
    </header> -->
    <div class="bbf-filters" id="bbfFilters" role="group" aria-label="Filter products by category"></div>
    <div class="bbf-grid" id="bbfGrid"></div>
  </div>
</section>
<button class="bbf-cart-toggle" id="bbfCartToggle" type="button" aria-label="Open cart" aria-controls="bbfCart" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20.5 8H6"/>
  </svg>
  <span class="bbf-cart-count" id="bbfCartCount" aria-live="polite">0</span>
</button>

<div class="bbf-overlay" id="bbfOverlay" hidden></div>
<aside class="bbf-cart" id="bbfCart" aria-label="Shopping cart" aria-hidden="true">
  <div class="bbf-cart-head">
    <h3>Your Cart</h3>
    <button type="button" class="bbf-close" id="bbfCartClose" aria-label="Close cart">&times;</button>
  </div>
  <ul class="bbf-cart-items" id="bbfCartItems"></ul>
  <div class="bbf-cart-foot">
    <div class="bbf-total"><span>Total</span><strong id="bbfCartTotal">&#8358;0</strong></div>
    <button type="button" class="bbf-checkout" id="bbfCheckout">Order on WhatsApp</button>
    <button type="button" class="bbf-clear" id="bbfClear">Clear cart</button>
  </div>
</aside>
<script src="product.js"></script>


</body>
</html>
